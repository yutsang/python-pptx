Long-term loans:
  type: BS
  category: Non-current liabilities
  aliases: ["Long-term loans", "Long-term loan", "Long term loans", "Long term loan",
            "长期借款", "長期借款", "Bank loans", "Bank borrowings"]
  patterns:
    Pattern 1: |
      the balance as at <DATE> represented the loan owed to <ENTITY> amounting to about <AMT> that would be due beyond 1 year. The weighted average interest rate during the Period was about <PCT>
    Pattern 2: |
      截至<DATE>末，<ENTITY>借款余额主要包括<AMT>长期借款。该笔借款授信额度合计<AMT>，已提款<AMT>，借款期为<DATE>至<DATE>。该笔借款的抵押物主要包括土地使用权
