      <ENTITY> mainly generated revenue from leasing income and property management service income with around a <PCT> ratio. Total revenue was about <AMT>, <AMT> and <AMT> in <DATE>, <DATE> and <DATE> respectively. Project was <PCT> leased to entities under <ENTITY> since <DATE>. The increase in revenue was mainly driven by the steady annual escalation in both leasing income and property management service income
    Pattern 2: |
      <ENTITY>主要从租金收入及物业管理费收入产生营业收入，比例约为<PCT>。营业收入分别为<AMT>、<AMT>、<AMT>，于<DATE>、<DATE>、<DATE>期间产生。主要租户为<ENTITY>，占比<PCT>。营业收入增长主要由新租户陆续入驻及单价稳步上升驱动
