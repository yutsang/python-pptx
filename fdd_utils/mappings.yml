      the balance as at <DATE> represented onshore bank loans of <AMT> that would be due within 1 year
    Pattern 2: |
      截至<DATE>末，<ENTITY>借款共计<AMT>，借款期为<DATE>至<DATE>。借款利率为基准利率加固定基点。其中<AMT>于一年内到期（已重分类至一年内到期的非流动负债）。该笔借款的抵押物主要包括公司土地使用权及地上建筑物
