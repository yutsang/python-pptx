      the balance as at <DATE> mainly entailed: <AMT> of borrowings from related parties (interest-free, to be settled prior to the proposed transaction); <AMT> of accrued expenses for consulting fees, accounting service fees, and property management fees; <AMT> of interest payables arising from bank loans
    Pattern 2: |
