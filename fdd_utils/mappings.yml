Contract liabilities:
  type: BS
  category: Current liabilities
  # Split out from "Advances" (commit pending) -- real batch data (Project
  # Mint, multiple entities) showed workbooks with BOTH "合同负债" and
  # "预收款项" as separate, independently-populated breakdown tabs, not just
  # two names for the same account. Sharing one mapping_key meant whichever
  # tab find_account_in_dfs picked first silently absorbed BOTH the
  # Financials line and the schedule data, leaving the other tab invisible
  # to reconciliation -- confirmed on 昆明经开 (Financials '合同负债'=0
  # incorrectly matched against the '预收款项' tab's real 778,966 balance).
  aliases: ["Contract liabilities", "Contract liability", "合同负债", "合同負債"]
  patterns:
