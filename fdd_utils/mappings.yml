  # own sequencing, and the commentary reopened a 流动负债 heading that had
  # already closed two accounts earlier ("流动负债 ... 非流动负债 ... 流动负债"
  # on two slides of a real deck). The grant behind it amortises over the
  # asset's life (50 years on this databook), which is the accounting answer
  # as well as the layout one.
