# Account definitions: the canonical key of each account, its statement type and category, and the names it goes by in a workbook (aliases).
# `patterns` are the project team's reference sentences for the account (house style); the agent reads its evidence, not these.
Cash:
  type: BS
  category: Current assets
  aliases: ["Cash", "Cash and Cash Equivalents", "Cash and cash equivalents", "貨幣資金", "货币资金", "Cash at bank", "Cash at bank and on hand"]
  patterns:
    Pattern 1 (ONLY where the remarks show the bank statements have NOT been obtained): |
      the balance as at <DATE> represented <AMT> of cash at bank with no restricted use. We have not obtained the bank statements yet
    Pattern 2 (仅当备注载明已取得并核对银行对账单时使用): |
      截至<DATE>，存款<AMT>，均为银行存款。我方获取并核对了截至<DATE>的银行对账单，未发现显著差异；该等存款不存在使用受限情况
    Pattern 3 (备注既未说明已核对、也未说明未取得时使用——两种说法都不要写): |
      截至<DATE>，存款<AMT>，均为银行存款，不存在使用受限情况
AR:
  type: BS
  category: Current assets
  aliases: ["AR", "Accounts Receivables", "Accounts Receivable", "Accounts receivable", "Accounts receivables",
            "Trade Receivables", "Trade receivables", "Trade Receivable", "Trade receivable",
            "應收賬款", "应收账款", "应收账款净额", "应收账款(净额)"]
  patterns:
    Pattern 1: |
      the balance as at <DATE> totalled <AMT>, mainly entailing the receivables of actual rental and property management income with issued fapiao from <ENTITY>, which were in line with the payment terms in the leasing agreements. The balance decreased dramatically due to the change of collection period. No bad debt had been incurred historically
    Pattern 2: |
      <DATE>末应收账款余额包括应收租户租金<AMT>、应收物管费<AMT>以及应收水电费<AMT>。管理层表示上述应收租服费的账龄一般都在半年之内，且目前不存在坏账风险
Prepayments:
  type: BS
  category: Current assets
  aliases: ["Prepayment", "Prepayments", "预付款项"]
  patterns:
    Pattern 1: |
      the balance as at <DATE> mainly entailed: 1) <AMT> of upfront payments for utility expenses; and 2) <AMT> in upfront payments for the next 1 year insurance fees
    Pattern 2: |
      系预付的水电费共<AMT>
OR:
  type: BS
  category: Current assets
  aliases: ["OR", "Other Receivables", "Other receivables", "Other Receivable", "Other receivables", "其他应收款", "其他應收款"]
  patterns:
    Pattern 1: |
      the balance as at <DATE> mainly entailed <AMT> of loans to the related party, <ENTITY>. Management said that the related-party loans were interest-free and would be settled prior to the proposed transaction
    Pattern 2: |
      系未来可退回的押金及保证金<AMT>
Inventory:
  type: BS
  category: Current assets
  aliases: ["Inventory", "Inventories", "存货", "库存", "存貨"]
  patterns:
    Pattern 1: N/A
 
IP:
  type: BS
  category: Non-current assets
  aliases: ["IP", "Investment Property", "Investment properties", "Investment property", "Investment Properties",
    "投资物业", "投资性房地产", "投資性房地產"]
  patterns:
    Pattern 1: |
      As regards the land use right, the land is located in <ENTITY> for industrial use, with land-use life of 50 years (until <DATE>). The investment properties were fully mortgaged for <ENTITY> bank loans. The original cost also comprised <AMT> of deed tax (<PCT> of the land premium). The land is depreciated using the straight-line method of 50-year useful life with no residual value. The original cost of the warehouses was <AMT>, depreciated using the straight-line method of 20-year useful life with a <PCT> residual rate
    Pattern 2: |
      截至<DATE>末，<ENTITY>账面价值为<AMT>，包括土地成本<AMT>、仓库建造成本和后期改造成本<AMT>。土地使用权相关成本的折旧年限为33年，无残值，仓库建造成本的折旧年限为20年、预计净残值率<PCT>。<ENTITY>已作为公司长期借款的抵押物
IA:
  type: BS
  category: Non-current assets
  aliases: ["IA", "Intangible Assets", "Intangible asset", "Intangible assets", "无形资产", "無形資產"]
  patterns:
    Pattern 1: N/A
 
NCA:
  type: BS
  category: Non-current assets
  aliases: ["NCA", "Non-current Assets", "Non-current asset", "Non-current assets", "Non Current Assets", "Non Current Asset",
            "Fixed Assets", "Fixed Asset", "Fixed assets", "Fixed asset", "FA", "固定資產", "固定资产"]
  patterns:
