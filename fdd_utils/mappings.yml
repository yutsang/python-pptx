    Pattern 1 (keep the verification sentence ONLY where the remarks say a report was checked; drop it otherwise): |
      the registered capital was <AMT>. All registered capital had been paid up. The balance at the consolidated level as at <DATE> represented <AMT> paid-in capital. We checked the audit report and found no differences in respect of this amount
    Pattern 2 (最后一句仅在备注载明已检查验资报告时保留；未载明则删去该句): |
      <ENTITY>的注册资本为<AMT>美元（折合人民币<AMT>）。实收资本系由境外股东出资形成。我们检查了验资报告，未发现差异
    Pattern 3 (备注载明「未经验资」时使用): |
      截至<DATE>，注册资本为<AMT>，已全额实缴。该实收资本未经验资，我方查看了相关外汇FDI登记凭证，未发现异常
