      the balance as at <DATE> mainly represented the net book values of electronic devices and office equipment, which amounted to <AMT> and <AMT> respectively. Electronic equipment and office equipment were both depreciated using the straight-line method over a 3-year useful life with a <PCT> residual value
    Pattern 2: |
      主要包括办公家具以及电子设备账面价值<AMT>。公司的固定资产折旧年限为3年，无净残值
NCL:
  type: BS
  category: Non-current liabilities
  aliases: ["NCL", "Non-current Liabilities", "Non-current liability", "Non-current liabilities", "Non Current Liabilities",
