openai:
  api_key: ""
  api_base: ""
  chat_model: ""
  api_version_completion: ""

local:
  api_base: "http://localhost:8000/v1"
  api_key: "not-needed"
  chat_model: "Qwen3-32B"   # must match the id your local server serves
  supports_thinking: true   # Qwen3 emits <think>; structured stages disable it via allow_thinking
  # The local server serves one request effectively serially — default to 1
  # worker. Every other provider defaults to 4 (parallel, no UI toggle
  # needed) unless overridden with its own max_workers (see workbench below).
  max_workers: 1

deepseek:
  api_key: ""
  api_base: "https://api.deepseek.com/v1"
  chat_model: "deepseek-chat"

# Internal enterprise gateway (Azure OpenAI-compatible). api_key doubles as
# the 'Ocp-Apim-Subscription-Key' header value the gateway requires.
# This file is committed to a PUBLIC repository -- keep the real hostname,
# deployment name and any credential in your own config.yml (gitignored),
# never here.
workbench:
  api_key: ""
  api_base: ""            # e.g. https://<your-gateway-host>/genai/azure/openai
  api_version: ""         # e.g. 2024-12-01-preview
  chat_model: ""          # your Azure deployment name
  charge_code: ""
  region_override: ""
  reasoning_effort: "high"           # "high" | "medium" | "low" | "" to omit
  # Model capability flags — confirmed against the real gateway. Flip these
  # if a future model/deployment behaves differently; the client also
  # self-heals on an unrecognised 400 by reading the rejected param's name
  # from the error body and retrying (up to 4 rounds), so these are a
  # fast-path, not the only line of defence.
  supports_temperature: false        # this model only allows temperature=1 (its default)
  supports_sampling_params: false    # this model rejects top_p / frequency_penalty / presence_penalty
  use_max_completion_tokens: true    # this model rejects legacy 'max_tokens'
  # Floor for max_completion_tokens (not a replacement for agents.*.max_tokens
  # below). Reasoning models spend part of the budget on hidden reasoning
  # before the visible answer, so a complex account can exhaust a small
  # per-agent budget and come back empty. 0/blank disables the floor.
  min_max_tokens: 3000
  # Concurrent worker threads per pipeline stage for THIS provider. Built-in
  # default (if omitted) is 2 for any non-local provider — raise it only
  # after validating the gateway handles it with test_workbench_concurrency.py.
  max_workers: 4
  # Deployment ids are environment-specific -- fill these in your own
  # config.yml (gitignored), not in this public example.
  available_models: []
    # - id: "<your-deployment-id>"
    #   label: "GPT-5.5"

agents:
  # allow_thinking: false sends enable_thinking=false to Qwen3 for structured
  # stages (skips <think> for speed + clean JSON). Omit / true keeps thinking on.
  1_Generator:
    temperature: 0.6
    max_tokens: 2000
    top_p: 0.95
    allow_thinking: true
  2_Auditor:
    temperature: 0.2
    max_tokens: 2000
    top_p: 0.8
    allow_thinking: false
    # workbench only — overrides workbench.reasoning_effort for this stage.
    # Auditor's job (verification, no creative writing) needs less reasoning
    # depth than Generator/Validator. Omit to inherit the global setting.
    reasoning_effort: "low"
  3_Refiner:
    temperature: 0.5
    max_tokens: 2000
    top_p: 0.9
    reduction_target_pct: 64
  4_Validator:
    temperature: 0.1
    max_tokens: 2000
    top_p: 0.8
    allow_thinking: false
    # Below this variance, a clause is immaterial and must NOT be flagged as
    # reasoning/hallucination — tempers the "when in doubt, flag it" bias.
    materiality_threshold_pct: 5

processing:
  data_format_for_ai: "json"
  # Per-account example sentences from mappings.yml go into the Generator
  # prompt. They were written when a much weaker local model needed a concrete
  # template to imitate; an audit (inspect_mapping_patterns.py) found 57% are
  # fill-in-the-blanks templates, which can constrain a capable model rather
  # than guide it. Set false to generate WITHOUT them and compare, rather than
  # arguing the point:
  #   python inspect_databook_to_pptx.py --databook X --pptx Y --style-profile
  #   python inspect_databook_to_pptx.py --databook X --pptx Y --check-claims
  inject_mapping_patterns: true
  debug_mode: false
  feedback_loop:
    enabled: true
    max_retries: 2
    unsupported_threshold: 0.3

# Thresholds for _variance_analysis_guidance (ai.py) — the deterministic
# movement/disproportion checks fed into the Generator+Auditor prompts.
# Omitting this block (or any key in it) falls back to these same values,
# so this section is documentation, not a required override.
analysis:
  variance_threshold_pct: 30   # an account's own period-over-period move at/above this is "material"
  disproportion_gap_pp: 30     # percentage-point gap vs revenue growth that counts as disproportionate
  max_extra_pairs: 2           # cap on how many EARLIER (non-latest) period pairs get a one-line mention

logging:
  suppress_http_logs: true

pptx:
  # Table style GUID for generated BS/IS tables. Blank = auto-detect from any
  # styled table already in the template (e.g. your UpSlide style). Find GUIDs
  # with: python list_table_styles.py <file>.pptx
  table_style_id: ""
  presentation_tables:
    # Renders a native PowerPoint table next to an account's commentary when
    # workbook.py's extract_presentation_detail_table finds a report-ready
    # breakdown on that account's sheet (e.g. 管理费用's 会计服务费/审计费/...).
    # ON since 2026-08-17. It sat "off until verified against a real export"
    # long enough that seven real entity decks went out with no per-account
    # breakdown table at all, and the absence was reported as a rendering bug
    # rather than a setting. An account with a table is pulled out of the
    # normal commentary-packing pool and given a slot to itself (see
    # _append_table_accounts_to_distribution) -- set false to compare.
    # FDD_SUBTABLES=0/1 in the environment overrides whatever is here.
    enabled: true
    # Fewest components a breakdown must have before it is worth a table.
    # Below this the lead-in sentence already names every one of them, so
    # the table is pure repetition -- a real export drew a 2-row
    # 管理费用 table under "主要包括管理费用-行政及管理层调整". 3 drops six
    # of that deck's seventeen tables. Set 2 for the old behaviour.
    min_rows: 3
    # Cap per STATEMENT, not per deck: the planner runs once for the balance
    # sheet and once for the income statement, and a deck-wide cap applied in
    # that order would let the balance sheet spend the whole budget before
    # the income statement was considered at all -- dropping exactly the
    # 营业收入/营业成本/税金及附加 breakdowns a reader looks for first. So 5
    # here means up to 5 + 5; halve it for ~5 in the deck.
    max_per_statement: 5
    # Ranking used ONLY when more accounts qualify than max_per_statement
    # allows; blank = the built-in order in helpers._TABLE_PRIORITY_DEFAULT.
    # Values are mapping keys (mappings.yml), not sheet names. Anything not
    # listed still gets a table when there is room, ranked after the list by
    # component count.
    # priority: [OI, OC, Tax and Surcharges, GA, Selling cost, Fin Exp, NCA, AR]
  commentary_packing:
    # Client-font-aware line fitting. metrics json files are committed IN the repo
    # (font_metrics/) so a deployment server needs no fonts installed at all.
    # Regenerate with: python dump_font_metrics.py <font>.ttf > font_metrics/x.json
    # (find the body font with: python detect_body_font.py template.pptx)
    # Paths are repo-relative or absolute; blank = measure with the system font.
    # Verify what's active with: python verify_font_calc.py
    font_metrics_path_eng: "font_metrics/arial_eng.json"
    font_metrics_path_chi: "font_metrics/msyh_chi.json"
    font_family_eng: "Arial"          # system-font fallback family (EN)
    font_family_chi: "Microsoft YaHei" # system-font fallback family (CN)
