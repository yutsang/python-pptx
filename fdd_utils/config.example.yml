# Which model a new session starts on. The dropdown itself is built from each
# provider's available_models; `listed: false` on a provider block (or on one
# available_models entry) takes it off the dropdown WITHOUT disabling it -- it
# stays callable from the command line. `python ad-hoc/workbench/config_report.py`
# prints, with no AI call, exactly what the dropdown will offer from this file and
# which model a new session starts on (a default provider that is not in the
# dropdown leaves the first entry of the list as the start).
default:
  ai_provider: "dashscope"
  model: "dashscope_deepseek-v4-flash-0731"   # an id from that provider's available_models (Flash: measured sufficient, 2026-11-17)

openai:
  api_key: ""
  api_base: ""
  chat_model: ""
  api_version_completion: ""

local:
  listed: true            # false hides the local model from the UI dropdown
  api_base: "http://localhost:8000/v1"
  api_key: "not-needed"
  chat_model: "Qwen3-32B"   # must match the id your local server serves

deepseek:
  api_key: ""
  api_base: "https://api.deepseek.com/v1"
  chat_model: "deepseek-chat"

# Internal enterprise gateway (Azure OpenAI-compatible). api_key doubles as
# the 'Ocp-Apim-Subscription-Key' header value the gateway requires.
# This file is committed to a PUBLIC repository -- keep the real hostname,
# deployment name and any credential in your own config.yml (gitignored),
# never here.
workbench:
  # Set vendor-specific header names only in your private config.yml.
  header_names: {}  # mapping: charge_code / region_override -> required HTTP header name
  listed: false           # off the UI dropdown; still the benchmark baseline
  api_key: ""
  api_base: ""            # e.g. https://<your-gateway-host>/genai/azure/openai
  api_version: ""         # e.g. 2024-12-01-preview
  chat_model: ""          # your Azure deployment name
  charge_code: ""
  region_override: ""
  reasoning_effort: "high"           # "high" | "medium" | "low" | "" to omit
  # Model capability flags — confirmed against the real gateway. Flip these
  # if a future model/deployment behaves differently; the client also
  # self-heals on an unrecognised 400 by reading the rejected param's name
  # from the error body and retrying (up to 4 rounds), so these are a
  # fast-path, not the only line of defence.
  supports_temperature: false        # this model only allows temperature=1 (its default)
  supports_sampling_params: false    # this model rejects top_p / frequency_penalty / presence_penalty
  use_max_completion_tokens: true    # this model rejects legacy 'max_tokens'
  # Floor for max_completion_tokens. Reasoning models spend part of the budget on hidden reasoning before the visible answer, so a
  # complex account can exhaust a small budget and come back empty. 0/blank disables the floor.
  min_max_tokens: 3000
  # Deployment ids are environment-specific -- fill these in your own
  # config.yml (gitignored), not in this public example.
  available_models: []
    # - id: "<your-deployment-id>"
    #   label: "GPT-5.5"

# DashScope CN AI Workbench (OpenAI-compatible). Real hostname + key live only
# in your gitignored config.yml — never commit them here. Probe with:
#   python ad-hoc/workbench/test_dashscope_connectivity.py
# default.ai_provider / default.model at the top of this file pick the one a
# session starts on; every `kind: chat` entry below is offered in the sidebar.
dashscope:
  header_names: {}  # used only by the connectivity probe with auth: workbench
  api_key: ""
  api_base: ""            # e.g. https://<host>/aiworkbench/openAi/v1
  auth: "bearer"          # bearer | workbench (probe only)
  charge_code: ""
  region_override: ""
  chat_model: "dashscope_qwen3.7-max"
  # Only if the gateway's documentation names its thinking switch: the body sent with the agent's thinking / reasoning_effort
  # per role. Unverified until `python ad-hoc/workbench/agent_acceptance.py probe --send` shows the gateway accepts it. Shape:
  # thinking_extra_body: {"on": {"enable_thinking": true}, "off": {"enable_thinking": false}}
  # Prices (optional, yuan per million tokens) go on each entry: price_in, price_out, and price_cached_in for input the
  # provider reports as served from its prompt cache. Without price_cached_in, cached input is priced at the full price_in
  # (the agent's books say so). Take it from the provider's price sheet; nothing here assumes a discount.
  # The dropdown lists these in this order and starts on default.model (above): Flash for the whole report, Pro when a person
  # wants the stronger model. The agent path (agent.models empty) writes with whatever the dropdown has selected.
  available_models:
    - id: "dashscope_deepseek-v4-flash-0731"
      kind: chat
      label: "DeepSeek-V4-Flash"
    - id: "dashscope_deepseek-v4-pro-0813"
      kind: chat
      label: "DeepSeek-V4-Pro"
    - id: "dashscope_qwen3.7-max"
      kind: chat
      label: "Qwen3.7-Max"
    - id: "kimi-k2.6_chat"
      kind: chat
      label: "Kimi-K2.6"
      listed: false   # 2026-10-21: gateway answers "Access Denied" for this account -- hidden from the dropdown
    - id: "text_v4_embedding"
      kind: embedding
      label: "Text-V4-Embedding"
    - id: "qwen3_rerank"
      kind: rerank
      label: "Qwen3-Rerank"

# The agent's own requests are sent with temperature, max_tokens and top_p from a built-in default (top_p 0.9); to change what the
# model is sent in those, name the agent here:
# agents:
#   fdd_agent:
#     top_p: 0.9

processing:
  # Cell styles (Excel indent / bold) of each tab, read straight from the .xlsx
  # zip. Their only use is the indent-based roll-up check: an indented line
  # whose parent already equals the sum of its children is treated as a
  # breakdown of that parent rather than as a separate line. false skips the
  # read entirely (a real databook once spent 20 minutes on it, before the
  # read was rewritten on 2026-10-21) at the cost of that check.
  read_cell_styles: true
  # Keep each answer the model gives, keyed by the exact request (provider,
  # model, both prompts, sampling parameters), and reuse it when the identical
  # request comes round again -- which is most of a re-run of the same
  # workbook. Anything that changes what is asked (a cell, an instruction, the
  # model) is asked afresh; the verifier, repair and export always run again.
  # Stored under fdd_utils/logs/response_cache/. FDD_RESPONSE_CACHE=0 in the
  # environment forces fresh answers for one run without editing this file.
  response_cache:
    enabled: false
    max_age_days: 30
  debug_mode: false

# The agent: the one path that writes commentary (fdd_utils/agent; the app and `python fdd_agent.py book` both run it). Everything
# here has a built-in default, so a missing key or block changes nothing; this block is where a limit is set or a flag turned on.
agent:
  max_steps: 12            # model turns per run
  max_tokens: 80000        # estimated prompt + completion tokens per run
  max_seconds: 300
  max_no_progress: 3       # consecutive steps that add no evidence and resolve nothing
  max_rejections: 3        # answers the gate may send back before the run stops
  max_model_calls: 60      # hard cap on model calls over one ASK or EDIT session (the app's workbench panel, --session); 0 = no cap
  max_calls_per_account: 40  # runaway guard of a WHOLE BOOK: this times its accounts (the app's run, fdd_agent.py book); 0 = no cap
  max_tokens_per_account: 120000   # the same, for charged tokens. A book is not held to max_session_tokens below: a cap that stops a model half way costs the run again
  # -- which model answers, and one budget over all of them (agent/routing.py) ---------------------------------------------
  routing: single          # single | escalate. escalate: a second model takes over a turn after `escalate_after` consecutive
                           # failures the first model could have repaired from the evidence it had. Never for missing evidence or
                           # a decision only a person can make. FDD_AGENT_ROUTING or --routing overrides this.
  escalate_after: 2
  max_escalations: 1       # per turn
  handoff_max_tokens: 3000 # size of the task state the second model starts from (it does not get the conversation)
  # Caps over one ASK or EDIT session (the app's workbench panel, --session): every model, every turn, every retry. Tokens count what the
  # provider reported where it reported, the estimate where it did not. 0 = no cap. A whole book is held to the per-account guards above.
  max_session_tokens: 400000
  max_session_seconds: 0
  max_session_escalations: 0
  max_session_cost: 0      # yuan; needs price_in / price_out (yuan per million tokens) on every model in use in its available_models entry
  # Task kinds that START on the escalation model, within max_escalations / max_session_escalations (routing only):
  # cross_account, adjustment_bridge. Empty = every turn starts on primary and escalates only on repeated capability failures.
  escalate_tasks: []
  # AIClient answers from another configured provider when the requested one is not configured. The agent refuses that
  # (figures and the bill would go somewhere nobody chose) unless this is true.
  allow_provider_fallback: false
  # true (default): a paragraph for one known account is written once from evidence the controller read itself, then
  # repaired claim by claim (methods.md 5); false: the tool loop from the first step, as before 2026-11-07
  prepared_write: true
  # Off until entity_trial.py shows they help. seed_facts: Python writes the balance and movement sentences, the model adds
  # the rest. review_meaning: a verified paragraph with a cause, notes, a basis caveat or part-year figures is read once by
  # the escalation model for meaning (needs agent.models.escalation); a repair that does not verify keeps the verified text.
  # review_meaning: mark -- the escalation model reads each verified paragraph once and only marks the sentences it objects to
  # (orange in the deck, with its reason); nothing is rewritten or left out. true is the repair mode described above.
  seed_facts: false
  review_meaning: false
  # The model leads each paragraph: it reads the evidence and records what must be said, decides who writes, checks every claim
  # against what it cites and the verifier's report, and decides; Python reads, computes and verifies as a tool. With
  # agent.models.escalation set, that model leads and agent.models.primary writes. A claim it keeps against the verifier is
  # listed for a person. Off until entity_trial.py (pro_lead / flash_lead / mixed_lead) shows it works.
  lead_write: false
  # plan_first: the escalation model reads each account's evidence once and writes points and traps; the primary writes from
  # them. The 2026-11-09 sentence review found the most wrong sentences in that arm (25 of 168): leave off.
  plan_first: false
  # tool_loop_on_repeat: when a draft fails the same way twice, hand the turn to the tool loop. Off: the write ends at the
  # rejection limit and the draft goes into the deck marked (the hand-over cost 0.3-0.9 yuan an account on Pro, 2026-11-09).
  tool_loop_on_repeat: false
  # research: the writer is told what its evidence says nothing about (a loan's rate and maturity, receivables' ageing, a
  # depreciation policy, what cash is made of) and may look ONCE, up to research_lookups read-only lookups; what it does not
  # find is shown to the reader as a source gap. It never hands the turn to the tool loop. Off until entity_trial.py arm
  # 'researched' is compared with arm 'flash' on books neither was tuned on.
  research: false
  research_lookups: 3
  # repair_inference: a draft that passes only as an inference (a reason such as "主要因X所致" with no note behind it) goes back to the
  # writer ONCE, before the deck colours the sentence orange, to cite the note or leave the reason out; what comes back is taken as
  # it is. On (the verifier colours only what the writer could not settle); false restores the colour without the extra call.
  repair_inference: true
  # judge_binding: a sentence the verifier refused only for how it READ the prose (the period or line a figure sits under, a make-up, a
  # rest) is read by the agent on the last refusal, figure by figure (the stronger model when one is configured, else the writer's), and
  # Python holds that reading to the evidence: cleared when it holds, red when the agent finds the sentence wrong (the writer then gets
  # one more reply with what was found), orange when nothing was read. false: such a sentence ends orange, never cleared.
  judge_binding: true
  models:                  # provider "" = agent.models decides nothing; then --model / the app's selection, else local
    primary:    {provider: "", model: "", thinking: "", reasoning_effort: "", max_output: 1500}   # e.g. dashscope / a Flash model id
    escalation: {provider: "", model: "", thinking: "", reasoning_effort: "", max_output: 1500}   # e.g. dashscope / a Pro model id
  # thinking: "" (nothing requested), off, on, or low / medium / high; reasoning_effort: low / medium / high (wins over an effort in
  # thinking). Provider branches: local sends allow_thinking; workbench sends reasoning_effort; dashscope / deepseek send a body ONLY
  # when their provider block declares thinking_extra_body (see dashscope below), recorded as unverified until a probe shows the
  # gateway acts on it. On any other branch the record says "not sent by this provider branch". max_output caps each call's output.

logging:
  suppress_http_logs: true

pptx:
  # Optional per-machine attribution; the public default is independent analysis.
  source_labels: {}
  # Table style GUID for generated BS/IS tables. Blank = auto-detect from any
  # styled table already in the template (e.g. your UpSlide style). Find GUIDs
  # with: python list_table_styles.py <file>.pptx
  table_style_id: ""
  presentation_tables:
    # Renders a native PowerPoint table next to an account's commentary when
    # workbook.py's extract_presentation_detail_table finds a report-ready
    # breakdown on that account's sheet (e.g. 管理费用's 会计服务费/审计费/...).
    # ON since 2026-08-17. It sat "off until verified against a real export"
    # long enough that seven real entity decks went out with no per-account
    # breakdown table at all, and the absence was reported as a rendering bug
    # rather than a setting. An account with a table is pulled out of the
    # normal commentary-packing pool and given a slot to itself (see
    # _append_table_accounts_to_distribution) -- set false to compare.
    # FDD_SUBTABLES=0/1 in the environment overrides whatever is here.
    enabled: true
    # Fewest components a breakdown must have before it is worth a table.
    # Below this the lead-in sentence already names every one of them, so
    # the table is pure repetition -- a real export drew a 2-row
    # 管理费用 table under "主要包括管理费用-行政及管理层调整". 3 drops six
    # of that deck's seventeen tables. Set 2 for the old behaviour.
    min_rows: 3
    # Tables in the WHOLE deck, both statements together (not per statement).
    # Enforced by _select_deck_subtables before either statement is planned,
    # since the per-statement planner runs BS first and cannot see the budget.
    max_per_deck: 5
    # Lines a drawn table shows above its total (2026-10-20). Past this the
    # smallest lines are folded into one 其他/Others line, so the total still
    # ties; children (indented drill-downs) go first. Adjustment lines are
    # always kept. Roll-forward and grouped tables (原值/累计折旧/净值) are
    # never folded. 0 = show every line the sheet has (the old behaviour).
    max_rows: 8
    # When more accounts qualify than max_per_deck allows, the INCOME
    # STATEMENT is served first and the balance sheet takes what is left --
    # a BS account's question is "how much", which the embedded BS grid
    # already answers, while an IS account's is "made of what". This order is
    # helpers._STATEMENT_PRIORITY and is strict: an income statement with 5
    # qualifying accounts leaves the balance sheet none. inspect_databook's
    # 3c prints every rejection, so check there before an expensive run.
    #
    # Within a statement, ranking falls to this list of mapping keys
    # (mappings.yml, not sheet names); blank = helpers._TABLE_PRIORITY_DEFAULT.
    # An account not listed still gets a table when there is room, ranked
    # after the list by component count.
    # priority: [OI, OC, Tax and Surcharges, GA, Selling cost, Fin Exp, NCA, AR]
  commentary_packing:
    # Client-font-aware line fitting. metrics json files are committed IN the repo
    # (font_metrics/) so a deployment server needs no fonts installed at all.
    # Regenerate with: python dump_font_metrics.py <font>.ttf > font_metrics/x.json
    # (find the body font with: python detect_body_font.py template.pptx)
    # Paths are repo-relative or absolute; blank = measure with the system font.
    # Verify what's active with: python verify_font_calc.py
    font_metrics_path_eng: "font_metrics/arial_eng.json"
    font_metrics_path_chi: "font_metrics/msyh_chi.json"
    font_family_eng: "Arial"          # system-font fallback family (EN)
    font_family_chi: "Microsoft YaHei" # system-font fallback family (CN)
